<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 찾기 - API Server</title>
    <link rel="stylesheet" href="/styles/index.css">
    <style>
        .find-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .find-box {
            background: white;
            border-radius: 15px;
            padding: 3rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .find-box h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .tab-menu {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem 1rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .btn-find {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-find:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .back-links {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .back-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-bottom: 1rem;
        }

        .back-home a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-home a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="find-container">
        <div class="find-box">
            <div class="back-home">
                <a href="/">← 홈으로 돌아가기</a>
            </div>
            
            <h1>🔍 계정 찾기</h1>
            
            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('id')" id="idTab">이메일 찾기</button>
                <button class="tab-btn" onclick="switchTab('password')" id="passwordTab">비밀번호 찾기</button>
            </div>
            
            <!-- 이메일 찾기 -->
            <div id="idContent" class="tab-content active">
                <form id="findIdForm">
                    <div class="form-group">
                        <label for="find-id-name">이름</label>
                        <input type="text" id="find-id-name" placeholder="이름을 입력하세요" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="find-id-phone">전화번호</label>
                        <input type="tel" id="find-id-phone" placeholder="전화번호를 입력하세요 (예: 010-1234-5678)" required>
                    </div>
                    
                    <button type="submit" class="btn-find">이메일 찾기</button>
                </form>
            </div>
            
            <!-- 비밀번호 찾기 -->
            <div id="passwordContent" class="tab-content">
                <form id="findPasswordForm">
                    <div class="form-group">
                        <label for="find-pw-email">이메일</label>
                        <input type="email" id="find-pw-email" placeholder="가입한 이메일을 입력하세요" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="find-pw-name">이름</label>
                        <input type="text" id="find-pw-name" placeholder="이름을 입력하세요" required>
                    </div>
                    
                    <button type="submit" class="btn-find">비밀번호 찾기</button>
                </form>
            </div>
            
            <div class="back-links">
                <a href="/move/auth/login">로그인</a> | <a href="/move/auth/register">회원가입</a>
            </div>
        </div>
    </div>

    <script>
        // 탭 전환
        function switchTab(tab) {
            const idTab = document.getElementById('idTab');
            const passwordTab = document.getElementById('passwordTab');
            const idContent = document.getElementById('idContent');
            const passwordContent = document.getElementById('passwordContent');
            
            if (tab === 'id') {
                idTab.classList.add('active');
                passwordTab.classList.remove('active');
                idContent.classList.add('active');
                passwordContent.classList.remove('active');
            } else {
                idTab.classList.remove('active');
                passwordTab.classList.add('active');
                idContent.classList.remove('active');
                passwordContent.classList.add('active');
            }
        }

        // 이메일 찾기
        document.getElementById('findIdForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('find-id-name').value;
            const phone = document.getElementById('find-id-phone').value;
            
            // TODO: 실제 이메일 찾기 API 호출
            console.log('이메일 찾기 시도:', { name, phone });
            alert(`등록된 이메일 주소를 SMS로 발송했습니다.\n전화번호: ${phone}`);
            
            window.location.href = '/login';
        });

        // 비밀번호 찾기
        document.getElementById('findPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('find-pw-email').value;
            const name = document.getElementById('find-pw-name').value;
            
            // TODO: 실제 비밀번호 찾기 API 호출
            console.log('비밀번호 찾기 시도:', { email, name });
            alert(`비밀번호 재설정 링크를 이메일로 발송했습니다.\n이메일: ${email}`);
            
            window.location.href = '/login';
        });
    </script>
</body>
</html>
