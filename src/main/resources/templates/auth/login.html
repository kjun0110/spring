<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - API Server</title>
    <link rel="stylesheet" href="/styles/index.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-box {
            background: white;
            border-radius: 15px;
            padding: 3rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .login-box h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .keep-login {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: #666;
            cursor: pointer;
        }

        .keep-login input {
            cursor: pointer;
        }

        .find-account {
            color: #667eea;
            text-decoration: none;
        }

        .find-account:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            color: #999;
            font-size: 0.9rem;
        }

        .social-login {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .social-btn.google {
            background: white;
        }

        .social-btn.naver {
            background: #03C75A;
        }

        .social-btn.kakao {
            background: #FEE500;
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-bottom: 1rem;
        }

        .back-home a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-home a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="back-home">
                <a href="/">← 홈으로 돌아가기</a>
            </div>
            
            <h1>🔐 로그인</h1>
            
            <form action="/auth/login" method="get">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="text" id="email" name="email" placeholder="이메일을 입력하세요 (예: user@example.com)" value="a" >
                </div>
                
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="text" id="password" name="password" placeholder="비밀번호를 입력하세요" required value="b">
                </div>
                
                <div class="login-options">
                    <label class="keep-login">
                        <input type="checkbox" id="keepLogin">
                        <span>로그인 상태 유지</span>
                    </label>
                    <a href="/move/auth/find-account" class="find-account">이메일/비밀번호 찾기</a>
                </div>
                
                <button type="submit" class="btn-login">로그인</button>
            </form>
            
            <div class="divider">또는</div>
            
            <div class="social-login">
                <button class="social-btn google" onclick="socialLogin('google')">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 20px; height: 20px;">
                </button>
                <button class="social-btn naver" onclick="socialLogin('naver')">
                    <span style="color: white; font-weight: bold; font-size: 1rem;">N</span>
                </button>
                <button class="social-btn kakao" onclick="socialLogin('kakao')">
                    <span style="font-weight: bold; font-size: 1rem;">K</span>
                </button>
            </div>
            
            <div class="signup-link">
                계정이 없으신가요? <a href="/move/auth/register">회원가입</a>
            </div>
        </div>
    </div>

    <script>
        // 로그인 처리
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // e.preventDefault() 제거 - form이 실제로 submit되어야 주소창에 파라미터가 보임
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const keepLogin = document.getElementById('keepLogin').checked;
            
            // TODO: 실제 로그인 API 호출
            console.log('로그인 시도:', { email, password, keepLogin });
            
            // 폼이 정상적으로 submit됨 (주소창에 ?email=a&password=b 표시)
        });

        // 소셜 로그인
        function socialLogin(provider) {
            // TODO: 실제 소셜 로그인 API 호출
            console.log(`${provider} 로그인 시도`);
            alert(`${provider} 로그인 기능은 준비 중입니다.`);
        }
    </script>
</body>
</html>
