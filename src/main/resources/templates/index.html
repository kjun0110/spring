<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>로그인</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 22px;
      text-align: center;
    }
    .row {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #3730a3;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>로그인</h1>
    <!-- 로그인 누르면 calculate.html로 이동 -->
    <form action="calculate.html" method="get">
      <div class="row">
        <label for="username">아이디</label>
        <input id="username" type="text" name="username" placeholder="아이디 입력" />
      </div>
      <div class="row">
        <label for="password">비밀번호</label>
        <input id="password" type="password" name="password" placeholder="비밀번호 입력" />
      </div>
      <button type="submit">로그인</button>
    </form>
  </div>
</body>
</html>
